objective:
  - improve voice tail-latency observability without storing transcript content
  - evaluate the existing voice, gaming, creator, desktop, memory, and VTuber systems as one product
  - map current research benchmarks to STAR-specific acceptance tests
  - avoid duplicate schedulers, memory stores, voice engines, game controllers, and avatar writers

