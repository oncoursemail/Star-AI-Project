sources:
  - id: livekit_eot_bench
    url: https://github.com/livekit/eot-bench
    scope: 14-language human-agent turn benchmark; labelled hesitation and true end-of-turn pauses
    star_application: separate false-cutoff rate from endpointing delay and inference latency
    limitation: not a complete multiparty social benchmark
  - id: opengameeval
    url: https://arxiv.org/abs/2610.02563
    published: 2026-10-01
    scope: 84 stateful Roblox Studio tasks, repeated attempts, observation/edit separation, scene and play checks
    star_application: pin benchmark artifacts; preserve observation coverage and EDIT/PLAY evidence
    limitation: published results are not STAR results
  - id: gameworld
    url: https://gameworld-project.github.io/
    scope: 34 games, 170 tasks, serialized state verification, separate real-time track
    star_application: distinguish progress from success; evaluate real-time control separately
    limitation: not a Roblox Studio benchmark
  - id: gamedevbench
    url: https://proceedings.mlr.press/v306/chi26a.html
    published: 2026-icml
    scope: 333 Godot game-development tasks across 2D, 3D, UI, and gameplay
    star_application: visual feedback, build/play/inspect acceptance
    limitation: Godot results do not establish Roblox performance
  - id: windowsworld
    url: https://aclanthology.org/2026.findings-acl.750/
    published: 2026-07
    scope: 181 tasks, 17 desktop applications, five subgoals on average, 78-percent multi-app
    star_application: cross-application workflows with intermediate checkpoints
    limitation: benchmark environment differs from STAR's actual Windows installation
  - id: agentcl
    url: https://arxiv.org/abs/2606.02461
    published: 2026-06-01
    scope: controlled continual-learning task streams, positive transfer and interference
    star_application: paired skill-on/off, related-task transfer, unrelated-task regression
    limitation: requires STAR-specific task stream and holdout design
  - id: llama_cpp_speed_bench
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/server/bench/speed-bench
    scope: latency, throughput, speculative acceptance, concurrency against running llama-server
    star_application: matched baseline/candidate runs with concurrency aligned to server slots
    limitation: results are host/model/build-specific

