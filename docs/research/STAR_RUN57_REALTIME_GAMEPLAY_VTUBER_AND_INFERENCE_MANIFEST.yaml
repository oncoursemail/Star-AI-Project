sources:
  - id: gameworld
    url: https://gameworld-project.github.io/
    type: benchmark
    finding: "34 browser games and 170 tasks; state-verifiable success and progress; GameWorld-RT keeps the environment running during inference."
    star_use: "Separate paused reasoning evaluation from latency-sensitive real-time gameplay."
  - id: gamedevbench
    url: https://github.com/waynchi/gamedevbench
    type: benchmark
    finding: "333 game-development tasks across 2D graphics, 3D graphics, UI and gameplay."
    star_use: "External game-creation reference; retain Roblox-specific Studio and Luau acceptance."
  - id: eot-bench
    url: https://github.com/livekit/eot-bench
    type: benchmark
    finding: "14-language end-of-turn benchmark; v1.1 adds accented-English and short-turn cohorts; evaluates false cutoffs against endpointing latency."
    star_use: "Measure conversational endpointing separately from model inference latency."
  - id: skill-coverage
    url: https://arxiv.org/abs/2606.20659
    type: research
    finding: "Trajectory-based behavior-constraint coverage distinguishes pass, fail and not-observed skill behavior."
    star_use: "Extend existing versioned skill contracts with paired skill-on/off evaluation."
  - id: counterfactual-trace-auditing
    url: https://arxiv.org/abs/2605.11946
    type: research
    finding: "Paired with-skill/without-skill traces reveal behavior changes hidden by aggregate pass rate."
    star_use: "Measure token cost, off-task artifacts, excess planning, recovery and negative transfer."
  - id: llama-cpp-speed-bench
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/server/bench/speed-bench
    type: benchmark
    finding: "Benchmark an already-running server; match client concurrency to server slots; compare saved baseline and speculative runs."
    star_use: "Reproducible paired inference tuning."
  - id: llama-cpp-moe-cache
    url: https://github.com/ggml-org/llama.cpp/blob/master/docs/moe-cache.md
    type: implementation_documentation
    finding: "MoE expert cache and CPU cache-miss share depend on host RAM, PCIe bandwidth, pinning and cache size."
    star_use: "Tune only on the actual model/runtime/host; never assume offload is faster."
