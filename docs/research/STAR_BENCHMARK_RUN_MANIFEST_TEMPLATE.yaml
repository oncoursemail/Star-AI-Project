# STAR benchmark-run manifest template.
# Copy into a run-specific artifact directory and fill every required field.
# Never put API keys, passwords, OAuth tokens, personal data, or raw viewer messages here.
schema_version: 1

run:
  id: "replace-with-unique-run-id"
  started_at_utc: "YYYY-MM-DDTHH:MM:SSZ"
  ended_at_utc: null
  purpose: "baseline | ablation | holdout | regression | hardware_acceptance"
  owner_approval_reference: null
  operator: "STAR evaluation harness"
  notes: ""

repository:
  name: "oncoursemail/Star-AI-Project"
  branch: "replace-with-exact-branch"
  commit_sha: "replace-with-full-commit-sha"
  working_tree_clean: true
  dirty_diff_sha256: null

benchmark:
  id: "replace-with-benchmark-id"
  upstream_url: "https://example.invalid"
  release_tag: "replace-with-pinned-release"
  task_class_revision: "replace-with-tag-or-commit"
  task_asset_revision: "replace-with-tag-or-commit"
  evaluator_revision: "replace-with-tag-or-commit"
  provider_image_digest: "sha256:replace-with-image-digest"
  website_fixture_revision: null
  task_count_expected: 0
  task_count_executed: 0
  task_split:
    practice_seed_set: "private-practice-set-id"
    validation_seed_set: "private-validation-set-id"
    sealed_holdout_id: "private-holdout-id"
  excluded_tasks:
    - task_id: ""
      reason: ""

agent:
  orchestration_revision: "replace-with-commit"
  model_provider: "local | remote | hybrid"
  model_id: "replace-with-exact-model-id"
  model_weights_revision: "replace-with-hash-or-release"
  tokenizer_revision: "replace-with-hash-or-release"
  quantization: "none | q4 | q5 | q8 | other"
  prompt_template_sha256: "replace-with-hash"
  skill_registry_revision: "replace-with-commit-or-snapshot"
  tool_adapter_revisions:
    - name: "replace-with-adapter"
      revision: "replace-with-commit"
      permission_profile: "read_only | sandbox_write | owner_approved"
  verifier_revision: "replace-with-commit"

# Run 40: exact serving configuration for reproducible local llama.cpp experiments.
inference_serving:
  backend: "llama.cpp | other"
  backend_build_sha: null
  server_context_size: 0
  server_batch_size: 0
  server_ubatch_size: 0
  parallel_slots: 0
  continuous_batching: false
  prompt_cache_enabled: false
  prompt_cache_reuse_tokens: 0
  flash_attention: "off | on | unsupported"
  speculative_method: "off | draft_model | ngram | mtp | eagle3 | other"
  draft_model_revision: null
  speed_bench_release: null
  speed_bench_split: null
  speed_bench_categories: []
  client_concurrency: 0
  matched_sample_manifest_sha256: null

# Run 40: candidate skill evolution is separate from model self-report.
skill_evolution:
  candidate_skill_id: null
  baseline_skill_revision: null
  candidate_skill_revision: null
  failure_attribution_revision: null
  static_checks_revision: null
  unit_checks_revision: null
  synthetic_eval_revision: null
  paired_eval_revision: null
  sealed_holdout_revision: null
  independent_verifier: false
  atomic_promotion_tested: false
  rollback_tested: false
  owner_approval_reference: null

environment:
  operating_system: "Windows | Linux | macOS | Android"
  os_build: "replace-with-build"
  runtime_version: "replace-with-runtime"
  vm_or_container_image: "replace-with-image-digest"
  display_resolution: "1920x1080"
  dpi_scale: 100
  cpu_model: "replace-with-model"
  cpu_cores_available: 0
  ram_gib: 0
  gpu_model: "replace-with-model-or-none"
  gpu_vram_gib: 0
  driver_version: null
  network_mode: "offline | controlled_fixture | internet"
  locale: "en-US"
  timezone: "UTC"

interaction:
  observation_mode: "screenshot | screenshot_and_accessibility | structured_state"
  capture_region: "owner-approved application/game region only"
  capture_rate_fps: 0
  action_rate_limit_per_second: 0
  max_steps_per_task: 0
  task_timeout_seconds: 0
  action_timeout_ms: 0
  manual_override_tested: false
  emergency_stop_tested: false
  # Run 39: bounded evidence selection; this is not compute admission or action authorization.
  perception_policy_revision: null
  perception_request_kinds: []
  max_media_units_per_turn: 0
  max_perception_requests_per_turn: 0
  evidence_reference_ttl_ms: 0
  observation_selection_trace_retained: false
  # Run 40: metadata-only multiparty context; never store transcripts or provider identities here.
  conversation_index_revision: null
  conversation_index_max_events: 0
  conversation_index_ttl_seconds: 0
  conversation_index_max_reply_depth: 0
  cross_platform_identity_linking: false
  raw_conversation_content_retained: false

# Run 41: task-aware fast/deep/background model routing; record exact revisions.
model_routing:
  policy_revision: null
  task_classifier_revision: null
  fast_model_id: null
  deep_model_id: null
  background_model_id: null
  escalation_policy_revision: null
  escalation_reason_codes: []
  max_escalations_per_task: 0
  fast_path_fraction: null
  deep_path_fraction: null
  background_path_fraction: null
  escalation_rate: null
  verified_quality_delta: null
  queue_wait_ms_p95: null

# Run 41: event-driven monitoring. Keep conditions and source IDs content-free.
monitoring:
  enabled: false
  benchmark_id: null
  benchmark_revision: null
  task_mode: "passive | active | no_op"
  source_adapter_revision: null
  condition_revision: null
  event_subscription_mode: "push | bounded_poll | replay"
  poll_backoff_policy_revision: null
  max_observations: 0
  max_tool_calls_while_waiting: 0
  cancellation_tested: false
  no_op_false_action_count: null
  reaction_latency_ms_p95: null
  idle_cpu_ms: null
  idle_model_calls: null
  idle_tool_calls: null

# Run 41: game evaluation must separate state-verified success from partial progress
# and keep paused/real-time tracks distinct.
game_evaluation:
  benchmark_id: null
  benchmark_revision: null
  game_build_revision: null
  task_seed_manifest_sha256: null
  track: "paused | slowed | realtime"
  action_adapter_revision: null
  state_verifier_revision: null
  manual_override_tested: false
  emergency_stop_tested: false
  success_rate: null
  normalized_progress_rate: null
  invalid_action_rate: null
  stale_observation_rejection_rate: null
  reaction_latency_ms_p95: null
  held_out_seed_set: null

# Run 41: streaming dimensions are separate; do not collapse into one naturalness score.
voice_evaluation:
  benchmark_id: null
  benchmark_revision: null
  replay_fixture_revision: null
  spoken_task_pass_at_1: null
  tool_call_f1: null
  turn_taking_score: null
  false_interruption_rate: null
  missed_direct_request_rate: null
  appropriate_silence_rate: null
  paralinguistic_control_score: null
  long_conversation_groundedness: null
  first_audible_response_ms_p95: null
  interruption_stop_ms_p95: null
  resume_correctness_rate: null

# Run 41: Live2D/VTube Studio transport. No tokens or viewer identifiers belong here.
avatar_transport:
  api_version: null
  plugin_api_user_authorized: false
  local_loopback_only: true
  playback_clock_source: "dac | unknown"
  parameter_pump_revision: null
  parameter_refresh_gap_ms_p95: null
  parameter_refresh_gap_ms_p99: null
  dropped_stale_update_count: null
  interruption_flush_tested: false
  model_change_reset_tested: false

resource_budget:
  max_wall_clock_seconds: 0
  max_model_calls: 0
  max_input_tokens: 0
  max_output_tokens: 0
  max_cpu_percent: 0
  max_ram_mib: 0
  max_gpu_vram_mib: 0
  max_background_workers: 0
  foreground_deadline_ms: 0
  background_pause_thresholds_revision: "replace-with-config-hash"

privacy_and_safety:
  data_class: "synthetic | owner_test | public_benchmark"
  personal_files_mounted: false
  viewer_identity_data_enabled: false
  raw_audio_retained: false
  raw_video_retained: false
  secrets_in_environment_only: true
  untrusted_content_is_data_only: true
  game_automation_allowlist_revision: null
  owner_stop_available: true
  external_side_effects_enabled: false
  retention_policy_revision: "replace-with-policy-revision"

metrics:
  task_success_rate: null
  partial_progress_rate: null
  verifier_agreement_rate: null
  false_success_rate: null
  recovery_success_rate: null
  queue_wait_ms_p50: null
  prefill_ms_p95: null
  decode_tokens_per_second_p50: null
  decode_tokens_per_second_p95: null
  kv_cache_bytes_peak: null
  kv_cache_quantization: "none | experimental | unsupported"
  speculative_draft_acceptance_rate: null
  audio_underrun_count: null
  perception_candidates_per_turn_p50: null
  perception_selected_media_units_p95: null
  perception_rejected_stale_count: null
  perception_duplicate_suppression_rate: null
  evidence_retrieval_ms_p95: null
  event_to_observation_ms_p95: null
  intent_conditioned_turn_score: null
  false_interruption_rate: null
  missed_direct_request_rate: null
  appropriate_silence_rate: null
  task_result_delivery_rate: null
  stale_result_drop_rate: null
  queue_wait_ms_p95: null
  first_token_ms_p50: null
  first_token_ms_p95: null
  inter_token_ms_p95: null
  first_audio_ms_p95: null
  audible_response_ms_p95: null
  interruption_stop_ms_p95: null
  capture_to_action_ms_p95: null
  game_frame_time_ms_p95: null
  game_frame_time_ms_p99: null
  obs_render_lag_frames: null
  obs_encoder_lag_frames: null
  cpu_percent_p95: null
  ram_mib_peak: null
  gpu_vram_mib_peak: null
  cost_per_verified_completion: null
  # Run 40: skill evolution and multiparty stream quality.
  skill_trigger_precision: null
  skill_trigger_recall: null
  skill_transfer_success_rate: null
  skill_regression_rate: null
  skill_rollback_success_rate: null
  addressee_accuracy: null
  reply_thread_accuracy: null
  topic_continuity_score: null
  # false_interruption_rate and appropriate_silence_rate are defined above.
  sentinel_no_op_false_action_count: null
  sentinel_reaction_latency_ms_p95: null
  gameworld_success_rate: null
  gameworld_normalized_progress_rate: null
  gameworld_invalid_action_rate: null
  fdbv3_pass_at_1: null
  fdbv3_tool_call_f1: null
  interactionbench_paralinguistic_score: null
  avatar_parameter_refresh_gap_ms_p99: null

results:
  outcome: "not_run | passed | failed | partial | blocked"
  verified_successes: 0
  verified_failures: 0
  abstentions: 0
  verifier_disagreements: 0
  failure_categories: {}
  artifacts_directory: "replace-with-private-artifact-path"
  artifact_hashes:
    trajectory_bundle_sha256: null
    metrics_sha256: null
    screenshots_sha256: null
  promotion_eligible: false
  promotion_decision_reference: null
  reviewer_notes: ""

reproducibility_checks:
  all_release_components_pinned: false
  clean_environment_verified: false
  practice_and_holdout_disjoint: false
  task_seeds_recorded: false
  verifier_independent_of_agent_claim: false
  no_secrets_or_personal_data_in_artifacts: false
