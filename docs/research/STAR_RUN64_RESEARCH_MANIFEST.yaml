primary_research:
  - id: agentodyssey
    url: https://agentodyssey.github.io/
    date: 2026
    venue: NeurIPS 2026
    focus: Test-time continual learning in procedurally generated long-horizon worlds.
    star_use: Evaluate exploration, world-knowledge acquisition, episodic memory, skill learning, planning, and cost.
    limitation: Benchmark performance is not STAR performance; short-term memory results do not justify indiscriminate memory growth.
  - id: cua-recovery
    url: https://arxiv.org/abs/2610.27645
    date: 2026-10-20
    focus: Detecting and recovering from policy-induced errors in long-horizon desktop workflows.
    star_use: Checkpoint lineage, error awareness, root-cause localization, and verified recovery.
    limitation: Published fine-tuning gains are model- and benchmark-specific.
  - id: opengameeval
    url: https://arxiv.org/abs/2610.02563
    date: 2026-10-01
    focus: Stateful Roblox Studio exploration, editing, scene verification, and simulated play.
    star_use: Inspect-before-edit traces and repeated executable task evaluation.
    limitation: Reported success rates are not STAR scores or live Roblox acceptance.
  - id: gameworld
    url: https://arxiv.org/abs/2604.07429
    date: 2026-04-08
    focus: 34 games and 170 state-verifiable multimodal game tasks.
    star_use: Separate progress, success, and real-time control tracks.
    limitation: Paused benchmark results do not establish real-time performance.
  - id: interactionbench
    url: https://arxiv.org/abs/2611.02430
    date: 2026-11-02
    focus: Conversational timing, spoken task accuracy, paralinguistic behavior, and long-context grounding.
    star_use: Measure client-heard delivery and task correctness separately.
    limitation: Protocol differences constrain direct cross-system rankings.
  - id: eot-bench
    url: https://github.com/livekit/eot-bench
    date: 2026
    focus: Real human-to-agent turn endpoints across 14 languages.
    star_use: Pause-aware endpointing and false-cutoff evaluation.
    limitation: Benchmark is an evaluator, not a production voice engine.
  - id: full-duplex-bench-v3
    url: https://arxiv.org/abs/2604.04847
    date: 2026-04-06
    focus: Real-human disfluencies and chained spoken tool use.
    star_use: Evaluate speech understanding, latency, turn-taking, and action correctness together.
  - id: dualdecoder
    url: https://arxiv.org/abs/2607.26475
    date: 2026-07-29
    focus: Predictive prefetch for sparse host-memory KV retrieval.
    reported_result: Up to 2.62x decode throughput in the evaluated system.
    limitation: Not evidence of compatibility or speedup on STAR's current backend or RTX 4060.
  - id: flashoffloading
    url: https://arxiv.org/abs/2611.07542
    date: 2026-11-05
    focus: Host-DRAM KV offload with compute/load overlap.
    limitation: Reported results use Ascend 910C and are not transferable to STAR's NVIDIA GPU.

