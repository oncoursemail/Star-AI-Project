architecture_decisions:
  - Extend existing room, playback, avatar, game, computer-use, memory, and resource-admission authorities.
  - Do not add a parallel scheduler, voice engine, avatar writer, memory database, or game controller.
  - Keep real-time control separate from strategic reasoning and background learning.
  - Use bounded queues, monotonic event IDs, cancellation epochs, and explicit freshness budgets.
  - Treat retrieved memory and viewer chat as untrusted data, not permissions.
  - Verify actual game state and delivered audio rather than relying only on generated text or queue timestamps.
  - Evaluate positive transfer, negative interference, forgetting, recovery, and task cost independently.
  - Require matched hardware baselines before claiming speedups.

