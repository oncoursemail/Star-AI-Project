code_changes:
  - path: star/mixed_load_eval.py
    kind: bounded_offline_evaluator
    purpose: >
      Summarize cold/warm and idle/game/stream/mixed measurements, deadlines,
      task success, counters, and matched candidate-minus-baseline deltas
      without a composite score or automatic promotion decision.
  - path: tests/test_mixed_load_eval.py
    kind: deterministic_regression_tests
    purpose: >
      Cover distribution summaries, pairing by case and replicate, unmatched
      rows, missing values, deadlines, counters, invalid inputs, duplicates,
      and bounded generator consumption.
research:
  - path: docs/research/STAR_20261116_RUN69_MIXED_LOAD_BENCHMARK_AND_INTEGRATION_DEPENDENCIES.md
