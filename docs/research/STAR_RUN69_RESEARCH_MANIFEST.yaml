sources:
  - id: gamer-2026
    url: https://arxiv.org/abs/2611.18397
    date: 2026-11-13
    type: research_paper
    use: long-horizon generalist vision-language-action gameplay, memory, sparse-thinking, multi-turn RL
    limitation: new paper; cloud-edge and training-scale results are not a local RTX 4060 deployment claim
  - id: generalist-game-agent-survey
    url: https://github.com/THUSI-Lab/Awesome-LFMs-Play-Games
    date: 2026-10-21
    type: research_survey_and_living_catalog
    use: separate game-agent datasets, models, harnesses, and benchmarks
    limitation: curated catalog; artifact availability and individual claims require source-level review
  - id: strataflux
    url: https://arxiv.org/abs/2611.08363
    date: 2026-11-05
    type: research_paper
    use: selective precision refinement and overlapped host/storage-to-device delivery
    limitation: RTX 5090 and unified-memory results are not transferable to STAR's GPU without measurement
  - id: flashoffloading
    url: https://arxiv.org/abs/2611.07542
    date: 2026-11-05
    type: research_paper
    use: KV cache hotness, host-device overlap, and long-context memory pressure
    limitation: reported deployment is Ascend 910C with vLLM-Ascend, not NVIDIA STAR hardware
  - id: nvidia-pair
    url: https://docs.nvidia.com/local-ai/nvpair
    type: official_documentation
    use: route independent inference requests to trusted paired nodes
    limitation: no VRAM pooling, model sharding, or in-flight request migration
  - id: llama-cpp-speed-bench
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/server/bench/speed-bench
    type: official_benchmark_documentation
    use: matched baseline/speculative tests, per-category prefill/decode/latency/draft acceptance
    limitation: concurrency should match server slots; target hardware and exact build still required
  - id: llama-cpp-ngram-cache-issue
    url: https://github.com/ggml-org/llama.cpp/issues/27852
    type: upstream_issue_report
    date: 2026-08-28
    use: motivate exact-build speculative-state reset and cross-request cache-isolation canaries
    limitation: issue is closed as not planned and does not establish that every build is affected
  - id: livekit-turns
    url: https://docs.livekit.io/agents/logic/turns/
    type: official_documentation
    use: separate endpointing, interruption, playback truncation, and turn ownership
  - id: livekit-adaptive-interruption
    url: https://docs.livekit.io/agents/logic/turns/adaptive-interruption-handling/
    type: official_documentation
    use: distinguish genuine barge-ins from conversational backchannels
  - id: livekit-turn-tuning
    url: https://docs.livekit.io/agents/logic/turns/tuning/
    type: official_documentation
    use: dynamic endpointing and preemptive-generation tradeoffs
  - id: vtube-studio-api
    url: https://github.com/DenchiSoft/VTubeStudio
    type: official_api_documentation
    use: authorized local WebSocket plugin, event subscriptions, model/parameter control
    limitation: user approval required; token must remain secret
  - id: obs-websocket
    url: https://github.com/obsproject/obs-websocket
    type: official_project_documentation
    use: authenticated OBS control and stream event integration
    limitation: local authenticated control preferred; remote control needs separate review
