sources:
  - id: eot_bench_v1_1
    url: https://github.com/livekit/eot-bench
    updated: 2026-11-13
    scope: 7342 human-agent turns, 14 languages, causal pause labels, false-cutoff versus endpoint-delay evaluation
    star_use: re-evaluate the existing EoT adapter against the pinned v1.1 release
    caveat: endpointing delay is not model inference latency; short-turn/right-censored cases must remain correctly labelled
  - id: opengameeval_2026
    url: https://arxiv.org/abs/2610.02563
    published: 2026-10-01
    scope: 84 stateful Roblox Studio tasks, 13 models, 16 attempts per task, scene and simulated play checks
    star_use: pin benchmark version and preserve EDIT/PLAY evidence
    caveat: published scores are not STAR results
  - id: windowsworld_2026
    url: https://aclanthology.org/2026.findings-acl.750/
    published: 2026-07
    scope: 181 cross-application tasks, 17 desktop apps, average five subgoals
    star_use: add multi-application desktop acceptance with checkpoint grading
    caveat: benchmark agents and simulated environment differ from STAR's Windows host
  - id: agent_memory_leaderboard
    url: https://agentmemories.ai/docs
    published: 2026-08-12
    scope: textual, multimodal, coding memory; recall, temporal reasoning, governance, personalization, execution, safety/privacy
    star_use: external memory evaluation dimensions
    caveat: do not upload private histories, transcripts, viewer data, prompts, or credentials
  - id: reliability_science
    url: https://arxiv.org/abs/2603.29231
    published: 2026-03-31
    scope: reliability decay, variance amplification, graceful degradation, meltdown onset across long horizons
    star_use: repeated-run, success-by-horizon and recovery scorecard
    caveat: paper metrics need a STAR-specific operational definition before release gates
  - id: agent_long_horizon_degradation
    url: https://arxiv.org/abs/2609.01660
    published: 2026-08-31
    scope: long-horizon degradation across models, task families, and context regimes
    star_use: test step-count sensitivity and checkpoint recovery
    caveat: results are paper-specific and not a direct prediction of STAR
  - id: llama_cpp_speculative
    url: https://github.com/ggml-org/llama.cpp/blob/master/docs/speculative.md
    scope: upstream speculative-decoding modes
    star_use: exact-binary capability detection before canary configuration
    caveat: moving master documentation must be pinned; supported flags vary by build
  - id: llama_cpp_speed_bench
    url: https://github.com/ggml-org/llama.cpp/tree/master/tools/server/bench/speed-bench
    scope: throughput, latency, draft acceptance, concurrency
    star_use: matched baseline/candidate benchmark with concurrency aligned to server slots
    caveat: benchmark numbers are not transferable to another host/model
  - id: turboquant
    url: https://research.google/blog/turboquant-redefining-ai-efficiency-with-extreme-compression/
    published: 2026-03-24
    scope: KV-cache/vector quantization research
    star_use: research watch; evaluate only if supported by a pinned runtime/backend
    caveat: not assumed to be directly supported by STAR's current llama.cpp path

integration_decisions:
  - reuse_one_resource_admission_authority
  - reuse_existing_task_and_delivery_ledger
  - reuse_existing_memory_stores_and_governance
  - reuse_existing_room_director_and_voice_bridge
  - reuse_one_avatar_parameter_arbiter
  - reuse_existing_obs_telemetry_path
  - reuse_existing_game_control_gate
  - preserve_independent_evaluators_and_sealed_holdouts
  - do_not_enable_unverified_models_or_speculative_modes
  - do_not_claim_speed_or_intelligence_gains_without_paired_measurements

