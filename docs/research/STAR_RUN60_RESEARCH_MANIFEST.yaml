objective:
  - consolidate the current open capability work into a dependency-aware integration sequence
  - update voice, Roblox, cross-application, memory, long-horizon, and inference evaluation references
  - define one system-level acceptance matrix for real-time streaming and autonomous work
  - prevent duplicate schedulers, ledgers, memory stores, voice engines, avatar writers, and action authorities

